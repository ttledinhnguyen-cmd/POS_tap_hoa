# Cấu hình nginx cho Tạp Hóa POS
# Dùng khi bạn đã có nginx cài sẵn trên server và không muốn dùng Docker.
#
# Đặt file này ở /etc/nginx/sites-available/pos-tap-hoa.conf
# rồi: ln -s /etc/nginx/sites-available/pos-tap-hoa.conf /etc/nginx/sites-enabled/
#
# HTTPS bằng certbot:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d ipos123.vn -d www.ipos123.vn
# Certbot sẽ tự sửa file này thêm SSL cert.
#
# Sau khi có cert, thêm block redirect www → apex (giữ 1 origin duy nhất vì
# IndexedDB tách theo origin):
#   server {
#       listen 443 ssl;
#       server_name www.ipos123.vn;
#       return 301 https://ipos123.vn$request_uri;
#   }

server {
    listen 80;
    listen [::]:80;
    server_name ipos123.vn www.ipos123.vn;

    # Redirect HTTP -> HTTPS (certbot sẽ tự thêm phần này khi chạy)
    # return 301 https://$server_name$request_uri;

    root /var/www/pos-tap-hoa;  # ĐỔI ĐƯỜNG DẪN tới thư mục dist
    index index.html;

    # Compress
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml
        application/wasm;

    # Cache assets có hash file name
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker phải fresh
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    # index.html không cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Manifest, icon - cache vừa phải
    location ~ ^/(manifest\.webmanifest|favicon\.svg|icon-.*\.png)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    # SPA fallback - mọi route không phải file thật trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bảo vệ file dotfiles
    location ~ /\. {
        deny all;
    }
}
